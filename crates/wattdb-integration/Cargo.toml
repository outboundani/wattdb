[package]
name = "wattdb-integration"
description = "wattdb's DynamoDB Local tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
## Runs the tests against DynamoDB Local: in Docker through testcontainers,
## or at the endpoint in WATTDB_DYNAMODB_ENDPOINT.
integration = ["dep:testcontainers"]

[dependencies]
aws-sdk-dynamodb.workspace = true
serde.workspace = true
serde_json.workspace = true
testcontainers = { workspace = true, optional = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wattdb.workspace = true

[dev-dependencies]
base64.workspace = true
futures.workspace = true
wattdb-vectors.workspace = true
